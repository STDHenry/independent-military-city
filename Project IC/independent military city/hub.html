<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independence City - Nội Thành</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="data:,">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- THANH ĐIỀU HƯỚNG -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl font-black tracking-wider text-amber-400">IC - HUB</span>
        </div>

        <!-- 4 Khu vực chức năng -->
        <div class="hidden md:flex space-x-6 font-medium text-sm">
            <a href="#" class="hover:text-amber-400 transition">Trang Chủ</a>
            <a href="#" class="hover:text-amber-400 transition">Cộng Đồng</a>
            <a href="#" class="hover:text-amber-400 transition">Chợ AD</a>
            <a href="#" class="hover:text-amber-400 transition">Ví Cư Dân</a>
        </div>

        <!-- Thông tin ví góc phải -->
        <div class="flex items-center space-x-4">
            <div class="text-right">
                <div id="user-name" class="text-sm font-semibold text-slate-300">Đang tải...</div>
                <div class="text-xs font-bold text-amber-400">
                    <span id="user-balance">0</span> AD
                </div>
            </div>
            <button id="btn-logout" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 px-3 rounded transition">
                Rời Thành
            </button>
        </div>
    </nav>

    <!-- HỘP THÔNG BÁO -->
    <div class="max-w-6xl mx-auto px-6 mt-4">
        <div id="hub-message" class="hidden p-4 rounded-lg text-center font-medium text-sm shadow-md"></div>
    </div>

    <!-- NỘI DUNG CHÍNH -->
    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- CỘT TRÁI & GIỮA: MẠNG XÃ HỘI -->
        <section class="lg:col-span-2 space-y-6">
            <!-- Ô Đăng Bài -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <textarea id="input-post-content" rows="3" 
                          placeholder="Hôm nay thành phố có biến gì không ông bạn?..." 
                          class="w-full p-3 rounded bg-slate-950 border border-slate-700 focus:outline-none focus:border-amber-400 text-white resize-none text-sm"></textarea>
                <div class="flex justify-end mt-2">
                    <button id="btn-create-post" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs py-2 px-4 rounded transition">
                        Phát Tin (Đăng Bài)
                    </button>
                </div>
            </div>

            <!-- Danh sách bài viết -->
            <div id="feed-container" class="space-y-4">
                <div class="text-center py-8 text-slate-500 text-sm">Đang tải bảng tin đô thị...</div>
            </div>
        </section>

        <!-- CỘT PHẢI: CHỢ -->
        <aside class="space-y-6">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-md">
                <h3 class="font-bold text-sm tracking-wide text-amber-400 uppercase mb-4">Chợ Giao Dịch AD</h3>
                
                <div id="market-container" class="space-y-4">
                    <div class="text-center py-4 text-slate-500 text-sm">Đang quét sạp hàng...</div>
                </div>
            </div>
        </aside>
    </main>

    <script type="module" src="./src/initHub.js"></script>
</body>
</html>
